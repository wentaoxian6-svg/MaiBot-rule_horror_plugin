# 学校场景 Prompt 模板
template: |
  你是一位精通规则怪谈创作的游戏设计师。请生成一个恐怖或诡异的规则怪谈的剧情导入和隐藏真相。

  **游戏模式：${game_mode}**

  **场景：废弃学校**

  **创作要求：**

  1. **背景故事**：
     - 这所学校在15年前因为一系列学生失踪事件而关闭
     - 失踪的学生都是在第4层的旧教室里消失的
     - 学校关闭后，附近居民经常看到深夜有灯光在4楼闪烁
     - 有传言说，那些失踪的学生从未离开...

  2. **玩家身份**：
     - ${game_mode}模式下，${player_role_description}
     - 你们是来调查学校传说的${investigation_team}
     - 每个人都对这所学校有着特殊的联系

  3. **恐怖氛围营造**：
     - 教室里还保留着当年的课桌椅，黑板上写着未完成的板书
     - 走廊里回荡着仿佛来自过去的读书声
     - 楼梯间的墙上画满了诡异的涂鸦
     - 空气中弥漫着粉笔和旧书的味道

  4. **核心象征符号**：
     - 数字"4"：学校的禁忌数字
     - 破碎的眼镜：象征着失去的知识和真相
     - 断续的上课铃声：暗示着时间的循环

  5. **隐藏真相**：
     这所学校的真相与${hidden_truth_theme}有关，
     而你们每个人的调查都将揭开一个痛苦的回忆...

  请以JSON格式返回，包含以下字段：
  - scene_name: 场景名称
  - background: 背景故事
  - player_identity: 玩家身份描述
  - core_symbols: 核心符号列表（每个包含name和description）
  - hidden_truth: 隐藏真相
  - atmosphere: 氛围描述
  - initial_location: 起始位置

variables:
  game_mode: "单人"
  player_role_description: "你是一名好奇心旺盛的调查记者"
  investigation_team: "调查团队"
  hidden_truth_theme: "一个被掩盖的校园悲剧"