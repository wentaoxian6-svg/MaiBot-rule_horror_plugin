# 医院场景 Prompt 模板
template: |
  你是一位精通规则怪谈创作的游戏设计师。请生成一个恐怖或诡异的规则怪谈的剧情导入和隐藏真相。

  **游戏模式：${game_mode}**

  **场景：废弃医院**

  **创作要求：**

  1. **背景故事**：
     - 这家医院在20年前因为一场神秘的医疗事故而关闭
     - 据说当时有7名患者在同一晚离奇死亡
     - 医院关闭后，附近居民经常听到深夜传来哭声和脚步声
     - 有传言说，那些死去的患者仍在医院里徘徊

  2. **玩家身份**：
     - ${game_mode}模式下，${player_role_description}
     - 你们是被派来调查医院异常现象的${investigation_team}
     - 每个人都带着自己的目的和秘密

  3. **恐怖氛围营造**：
     - 医院内部弥漫着消毒水和腐臭混合的气味
     - 走廊里的灯光忽明忽暗，发出滋滋的电流声
     - 墙上还挂着20年前的老照片，照片中的人似乎在注视着你们
     - 空气中弥漫着一种说不出的压抑感

  4. **核心象征符号**：
     - 数字"7"：出现在各种意想不到的地方
     - 破碎的听诊器：象征着破碎的生命和希望
     - 断续的监护仪声音：暗示着死亡的临近

  5. **动态环境变化（随着时间推移）**：
     - **游戏开始（0-30分钟）**：
       * 医院保持着废弃多年的静谧，只有风声和偶尔的滴水声
       * 灯光虽然昏暗但还算稳定，走廊尽头隐约可见应急出口的标志
       * 空气中弥漫着淡淡的消毒水味，掩盖了更深层的腐臭
     
     - **深入探索（30-90分钟）**：
       * 灯光开始不稳定，走廊尽头传来推车轮子的吱呀声，但检查时空无一人
       * 墙上的病历单开始浮现模糊的字迹，似乎记录着某个熟悉的名字
       * 温度明显下降，呼出的气息变成了白雾，脚步声在走廊里产生不自然的回音
       * 偶尔能听到远处传来7声清晰的脚步声，然后戛然而止
     
     - **真相逼近（90-180分钟）**：
       * 医院的布局似乎开始变化，原本熟悉的走廊变得陌生
       * 镜子里开始出现延迟的倒影，仿佛有什么东西在模仿玩家的动作
       * 空气中除了腐臭，还多了一种铁锈般的血腥味
       * 墙壁上开始出现暗红色的痕迹，形状像是无数的手掌印
       * 监护仪的声音越来越频繁，有时甚至能听到心跳声与玩家的心跳同步
     
     - **最后阶段（180分钟以上）**：
       * 现实与虚幻的界限彻底模糊，医院的某些区域似乎通向不存在的空间
       * 那些死去患者的身影开始频繁出现，有时只是眼角余光的一闪
       * 所有的时钟都指向7:07，时间仿佛静止在这一刻
       * 空气中回荡着低沉的诵经声，似乎在进行某种仪式
       * 玩家开始怀疑：到底是自己在调查这家医院，还是医院一直在等待着自己？

  6. **隐藏真相**：
     这家医院的真相与${hidden_truth_theme}有关，
     而你们每个人的到来都并非偶然...

  请以JSON格式返回，包含以下字段：
  - scene_name: 场景名称
  - background: 背景故事
  - player_identity: 玩家身份描述
  - core_symbols: 核心符号列表（每个包含name和description）
  - hidden_truth: 隐藏真相
  - atmosphere: 氛围描述
  - initial_location: 起始位置

variables:
  game_mode: "单人"
  player_role_description: "你是一名勇敢的都市传说调查员"
  investigation_team: "调查小组"
  hidden_truth_theme: "一个被遗忘的医疗实验"