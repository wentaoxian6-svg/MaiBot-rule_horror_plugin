# 默认规则生成 Prompt
template: |
  基于以下场景信息，生成规则怪谈的规则：

  **场景：${scene_name}**
  **背景：${background}**
  **玩家身份：${player_identity}**
  **核心象征符号：${core_symbols}**

  **规则生成要求：**

  1. **规则数量**：生成${rule_count}条规则
  2. **规则类型**：
     - 生存规则：确保基本生存（2-3条）
     - 行为规则：限制玩家行为（2-3条）
     - 认知规则：影响玩家认知（1-2条）
     - 隐藏规则：需要推理才能发现（1-2条）

  3. **规则特点**：
     - 看似合理但暗藏杀机
     - 部分规则可能是假的或误导性的
     - 规则之间应该有逻辑关联
     - 规则应该与场景和象征符号相关

  4. **规则复杂度**：
     - 简单规则：直接明了（如"不要独自行动"）
     - 复杂规则：需要理解（如"当钟声响起时，不要相信镜子里的自己"）
     - 矛盾规则：看似矛盾（如"必须保持安静，但必须回应呼唤"）

  5. **通关条件**：
     基于规则生成一个具有挑战性的通关条件，
     需要玩家推理出规则的真实含义并找到解决方案。

  请以JSON格式返回，包含以下字段：
  - rules: 规则列表（每个包含id, text, type, difficulty, hidden_truth）
  - win_condition: 通关条件描述
  - rule_interactions: 规则间的关联说明
  - misleading_rules: 误导性规则的索引列表

variables:
  rule_count: 6
  scene_name: "未知场景"
  background: "未知背景"
  player_identity: "未知身份"
  core_symbols: "未知符号"